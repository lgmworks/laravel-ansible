---
- name: delete default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
# - name: delete nginx.conf
#   file:
#     path: /etc/nginx/nginx.conf
#     state: absent

- name: Write the nginx.conf
  template: src=configs/nginx.conf.j2 dest=/etc/nginx/nginx.conf
  notify: restart nginx

- name: write the fastcgi_params
  template: src=configs/fastcgi_params dest=/etc/nginx/fastcgi_params
  notify: restart nginx

- name: Write several configs
  template: src="configs/{{item}}.j2" dest="/etc/nginx/conf.d/{{item}}"
  with_items:
    - cloudfare.conf
    - gzip.conf
    - uploads.conf
  notify: restart nginx

- name: 'Get certificate'
  command: '/snap/bin/certbot -n --nginx certonly -d {{item.domain_name}}'
  when: item.secure
  args:
    creates: '/etc/letsencrypt/live/{{item.domain_name}}'
  ignore_errors: no
  loop: "{{sites}}"
  tags:
    - nginx
    - certbot

- name: "Write base domain secure with TLS server block"
  template:
    src: sites/base-domain-secure-config.j2
    dest: "/etc/nginx/sites-available/{{item.base_domain_name}}"
  notify: restart nginx
  when:
    - item.base_domain_name
    - item.secure
  loop: "{{sites}}"

- name: "Write base domain secure with TLS server block"
  template:
    src: sites/base-domain-unsecure-config.j2
    dest: "/etc/nginx/sites-available/{{item.base_domain_name}}"
  notify: restart nginx
  when:
    - item.base_domain_name
    - not item.secure
  loop: "{{sites}}"

- name: "Create a symbolic links"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{item.base_domain_name}}"
    dest: "/etc/nginx/sites-enabled/{{item.base_domain_name}}"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    state: link
  notify: restart nginx
  when: item.base_domain_name
  loop: "{{sites}}"

- name: "Write main domain secure with TLS server block"
  template:
    src: sites/main-domain-secure-config.j2
    dest: "/etc/nginx/sites-available/{{ item.domain_name }}"
  notify: restart nginx
  when: item.secure | bool
  loop: "{{ sites }}"

- name: "Write NOT secured with TLS server block"
  template:
    src: sites/main-domain-unsecure-config.j2
    dest: "/etc/nginx/sites-available/{{ item.domain_name }}"
  notify: restart nginx
  when: not item.secure | bool
  loop: "{{ sites }}"

- name: "Create a symbolic link for main domain"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{item.domain_name}}"
    dest: "/etc/nginx/sites-enabled/{{item.domain_name}}"
    owner: "{{ remote_user }}"
    group: "{{ remote_user }}"
    state: link
  notify: restart nginx
  loop: "{{sites}}"

- name: create main dir
  file:
    path: "{{ item.code_path }}"
    state: directory
    group: "www-data"
    owner: "{{remote_user}}"
  loop: "{{sites}}"

- name: set permissions to main directory
  command: "chmod g+s {{ item.code_path }}"
  become: Yes
  become_user: "{{remote_user}}"
  loop: "{{sites}}"

- name: set permissions to main directory g+x
  command: "chmod 755 {{ item.code_path }}"
  become: Yes
  become_user: "{{remote_user}}"
  loop: "{{sites}}"

- name: create public dir
  file:
    path: "{{ item.code_path }}/public"
    state: directory
    group: "{{remote_user}}"
    owner: "{{remote_user}}"
  loop: "{{sites}}"

- name: create artisan mock dir
  file:
    path: "{{ item.code_path }}/artisan_current/public"
    state: directory
    group: "{{remote_user}}"
    recurse: true
    owner: "{{ remote_user }}"
  loop: "{{sites}}"

- name: "Create a temporal symbolic link for nginx service to start"
  ansible.builtin.shell:
    cmd: "ln -s {{ item.code_path }}/artisan_current {{ item.code_path }}/current"
  notify: restart nginx
  become: yes
  loop: "{{sites}}"
  ignore_errors: yes

- name: "write index.html in for nginx to start"
  template:
    src: index.html
    dest: "{{ item.code_path }}/artisan_current/public/index.html"
  loop: "{{sites}}"

- name: mock artisan
  template:
    src: artisan.j2
    dest: "{{ item.code_path }}/artisan_current/artisan"
  loop: "{{sites}}"

- name: Make artisan file executable
  file:
    path: "{{ item.code_path }}/current/artisan"
    owner: "{{remote_user}}"
    group: "{{remote_user}}"
    mode: "+x"
  loop: "{{sites}}"
