---
remote_user: vagrant
ansible_port: 2200
remote_group: www-data
ansible_python_interpreter: /usr/bin/python3
php_version: 8.3
upload_max_size: 30M

admin_password: admin_password
root_password: "your_root_password"
admin_user: forge
password_validation_policy: 1
timezone: Etc/UTC
mysql_backups_bucket: mysql-backup-example
#available values: s3, local
backup_location: local
restore_backup: No
backup_file_name: backup.sql
restore_db: No

certs_email: you@youremaildomain.com

deploy_domain: example.com
sites:
  - code_path: "/home/{{ remote_user }}/example.com"
    domain_name: example.com
    secure: false
    repo_url: git@github.com:example/example.git
    branch: main
    # eg: my-site.com -> 301 -> www.my-site.com
    base_domain_name:








